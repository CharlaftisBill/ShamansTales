<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/deck-viewer.css">
</head>

<body>
    <!-- Deck Loading Screen -->
    <div id="loading-screen">
        <div class="loading-panel">
            <h1 id="loading-title">Summoning Assets...</h1>
            <div id="loading-progress-container">
                <div id="loading-progress-bar"></div>
            </div>
            <p id="loading-text">Loading deck data...</p>
        </div>
    </div>

    <div class="header-controls">
        <a href="index.html" class="back-btn">← Menu</a>
        <label for="deck-selector">Select Faction:</label>
        <select id="deck-selector">
            <!-- Populated by JS -->
        </select>
    </div>

    <div id="viewer-container">
        <!-- Left: Compact Roster Grid -->
        <div id="left-pane">
            <div id="deck-grid">
                <!-- Compact Cards generated by JS -->
            </div>
        </div>

        <!-- Right: Premium Full-Art Preview -->
        <div id="right-pane">
            <div id="card-preview-container">
                <div class="placeholder-text">Hover over a card to inspect.</div>
            </div>
        </div>
    </div>

    <script type="module" src="src/deck-viewer.js"></script>
</body>

</html>
