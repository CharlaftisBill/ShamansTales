<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamans Tales - Main Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <!-- Main Menu -->
    <div id="main-menu" class="menu-container">
        <h1 class="game-title">Shamans Tales</h1>
        <div class="menu-buttons">
            <button id="btn-vs-ai" class="menu-btn">AI</button>
            <button id="btn-vs-online" class="menu-btn disabled-btn">Online<span class="coming-soon">(Soon)</span></button>
            <button id="btn-deck" class="menu-btn">Deck</button>
            <button id="btn-tuttorial" class="menu-btn disabled-btn">Tutorial<span class="coming-soon">(Soon)</span></button>
            <button id="btn-settings" class="menu-btn">Settings</button>
        </div>
    </div>

    <!-- Match Setup Modal -->
    <div id="setup-modal" class="modal-hidden">
        <div class="setup-panel">
            <h2>Match Setup</h2>
            <div class="faction-selectors">
                <div class="selector-group">
                    <label for="player-faction">Your Faction:</label>
                    <select id="player-faction">
                        <option value="Greek">Greek</option>
                        <option value="Norse">Norse</option>
                    </select>
                </div>
                <div class="selector-group">
                    <label for="ai-faction">AI Faction:</label>
                    <select id="ai-faction">
                        <option value="Norse">Norse</option>
                        <option value="Greek">Greek</option>
                    </select>
                </div>
            </div>
            <div class="setup-buttons">
                <button id="btn-setup-back" class="menu-btn small">Back</button>
                <button id="btn-setup-next" class="menu-btn small">Continue</button>
            </div>
        </div>
    </div>

    <!-- RPS Modal -->
    <div id="rps-modal" class="modal-hidden">
        <div class="rps-panel">
            <h2 id="rps-title">Who Goes First?</h2>
            <p id="rps-subtitle">Play Rock, Paper, Scissors</p>
            
            <div id="rps-selection-area">
                <button class="rps-btn" data-choice="rock">✊</button>
                <button class="rps-btn" data-choice="paper">✋</button>
                <button class="rps-btn" data-choice="scissors">✌️</button>
            </div>

            <div id="rps-result-area" class="hidden">
                <div class="rps-hands">
                    <div class="rps-hand">
                        <span class="rps-label">You</span>
                        <div id="rps-player-choice" class="rps-icon">✊</div>
                    </div>
                    <div class="rps-vs">VS</div>
                    <div class="rps-hand">
                        <span class="rps-label">AI</span>
                        <div id="rps-ai-choice" class="rps-icon">✌️</div>
                    </div>
                </div>
                <h3 id="rps-winner-text">You Win!</h3>
                <button id="btn-rps-retry" class="menu-btn small hidden">Play Again</button>
                <button id="btn-rps-continue" class="menu-btn small hidden">Start Game</button>
                <button id="btn-rps-cancel" class="menu-btn small">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Play First Modal -->
    <div id="play-first-modal" class="modal-hidden">
        <div class="rps-panel">
            <h2>You Won!</h2>
            <p>Do you want to play first?</p>
            <div class="setup-buttons">
                <button id="btn-play-first" class="menu-btn small">Yes</button>
                <button id="btn-play-second" class="menu-btn small">No</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-hidden">
        <div class="setup-panel settings-panel">
            <h2>Settings</h2>
            
            <div class="settings-section">
                <h3>Audio Preferences</h3>
                <div class="setting-row">
                    <label for="set-master-vol">Master Volume:</label>
                    <input type="range" id="set-master-vol" min="0" max="100" value="100">
                </div>
                <div class="setting-row">
                    <label for="set-bgm-vol">Music Volume:</label>
                    <input type="range" id="set-bgm-vol" min="0" max="100" value="100">
                </div>
                <div class="setting-row">
                    <label for="set-sfx-vol">SFX Volume:</label>
                    <input type="range" id="set-sfx-vol" min="0" max="100" value="100">
                </div>
                <div class="setting-row">
                    <label for="set-mute">Mute All:</label>
                    <input type="checkbox" id="set-mute">
                </div>
            </div>

            <div class="settings-section">
                <h3>Gameplay Preferences</h3>
                <div class="setting-row">
                    <label for="set-gfx-quality">Graphics Quality:</label>
                    <select id="set-gfx-quality">
                        <option value="hq">High</option>
                        <option value="lq">Low</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label for="set-fast-mode">Fast Animations:</label>
                    <input type="checkbox" id="set-fast-mode">
                </div>
                <div class="setting-row">
                    <label for="set-bg-anim">Animated Backgrounds:</label>
                    <input type="checkbox" id="set-bg-anim" checked>
                </div>
                <div class="setting-row">
                    <label for="set-screen-shake">Screen Shake:</label>
                    <input type="checkbox" id="set-screen-shake" checked>
                </div>
                <div class="setting-row">
                    <label for="set-holograms">Card Holograms:</label>
                    <input type="checkbox" id="set-holograms" checked>
                </div>
            </div>

            <div class="setup-buttons">
                <button id="btn-settings-cancel" class="menu-btn small">Cancel</button>
                <button id="btn-settings-save" class="menu-btn small">Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
