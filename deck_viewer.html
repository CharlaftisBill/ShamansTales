<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        /* Standalone Viewer Overrides */
        body {
            overflow: hidden; 
            margin: 0;
            padding: 0;
            background-color: #111; 
        }

        .header-controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
        }

        .header-controls label {
            color: #f1c40f;
            font-size: 1.2em;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        select#deck-selector {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid #3498db;
            padding: 8px 15px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        select#deck-selector:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        /* 2-Pane Layout */
        #viewer-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding-top: 70px; /* Room for header */
            box-sizing: border-box;
        }

        #left-pane {
            flex: 2;
            padding: 20px;
            overflow: hidden; /* No scrolling */
            display: flex;
            justify-content: center;
            align-items: center; /* Center the grid vertically */
        }

        #deck-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
            max-width: 900px;
            justify-items: center;
            align-items: center;
        }

        #right-pane {
            flex: 1;
            min-width: 350px;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.5);
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        /* Adjusting small card entity styling for the grid */
        .grid-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            height: 100%;
            max-height: 100%;
            width: auto;
            aspect-ratio: 2 / 3;
            max-width: unset;
        }
        
        .grid-card:hover {
            transform: scale(1.1) translateY(-10px);
            z-index: 10;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        #card-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Right pane preview scaling */
        #right-pane .premium-card-25d {
            width: 100%;
            height: auto;
            max-height: 100%;
            aspect-ratio: 2 / 3;
            container-type: inline-size;
            margin: 0;
            /* Add some visual pop to the preview */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(241, 196, 15, 0.2);
        }

        /* Override clamps so preview scales infinitely without breaking */
        #right-pane .inspect-scale.full-art-cost-container { top: 5cqw; left: 5cqw; }
        #right-pane .inspect-scale .full-art-cost-icon { width: 15cqw; height: 15cqw; }
        #right-pane .inspect-scale .full-art-cost-value, #right-pane .inspect-scale .full-art-amp-value { 
            width: 7.3cqw; height: 7.3cqw; font-size: 4.3cqw; 
            bottom: -2cqw; right: -2cqw;
        }
        #right-pane .inspect-scale.full-art-class-container { top: 5cqw; right: 5cqw; }
        #right-pane .inspect-scale .full-art-class-icon { width: 15cqw; height: 15cqw; }
        #right-pane .inspect-scale.full-art-bottom-info-container { 
            bottom: 6.6cqw; left: 6.6cqw; right: 6.6cqw; 
        }
        #right-pane .inspect-scale .full-art-card-name { font-size: 8cqw; margin-bottom: 2cqw; line-height: 1.1; }
        #right-pane .inspect-scale .full-art-card-type-text { font-size: 4cqw; margin-bottom: 3cqw; }
        #right-pane .inspect-scale .full-art-card-desc { font-size: 4.5cqw; }
        #right-pane .full-art-influence-value-large { font-size: 18.6cqw; }
        
        .placeholder-text {
            color: rgba(255,255,255,0.3);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Deck Loading Screen -->
    <div id="loading-screen">
        <div class="loading-panel">
            <h1 id="loading-title">Summoning Assets...</h1>
            <div id="loading-progress-container">
                <div id="loading-progress-bar"></div>
            </div>
            <p id="loading-text">Loading deck data...</p>
        </div>
    </div>

    <div class="header-controls">
        <label for="deck-selector">Select Faction:</label>
        <select id="deck-selector">
            <!-- Populated by JS -->
        </select>
    </div>

    <div id="viewer-container">
        <!-- Left: Compact Roster Grid -->
        <div id="left-pane">
            <div id="deck-grid">
                <!-- Compact Cards generated by JS -->
            </div>
        </div>
        
        <!-- Right: Premium Full-Art Preview -->
        <div id="right-pane">
            <div id="card-preview-container">
                <div class="placeholder-text">Hover over a card to inspect.</div>
            </div>
        </div>
    </div>

    <script type="module" src="src/deck_viewer.js"></script>
</body>

</html>
